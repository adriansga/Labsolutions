<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oglądalność prezentacji ELABS</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#061322">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <style>
    :root { --navy:#061322; --ink:#102235; --muted:#5c6f82; --line:#dce5ee; --brand:#1d6fdc; --surface:#fff; --canvas:#f5f8fb; --success:#138a63; }
    * { box-sizing: border-box; }
    body { margin:0; padding:32px 20px 64px; color:var(--ink); background:var(--canvas); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.55; }
    main { width:min(1100px,100%); margin:auto; }
    header { padding:30px; border-radius:24px; color:#fff; background:linear-gradient(145deg,var(--navy),#0b3653); }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.4rem); line-height:1.05; letter-spacing:-.04em; }
    header p { margin:12px 0 0; color:#c4d6e4; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin:24px 0; }
    .creator { display:grid; grid-template-columns:1fr auto; gap:12px; padding:22px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    .creator label { grid-column:1/-1; font-weight:750; }
    .creator input { min-height:48px; padding:0 14px; border:1px solid #b8c7d5; border-radius:12px; color:var(--ink); background:#fff; font:inherit; }
    .created-link { display:none; grid-column:1/-1; padding:16px; border-radius:12px; background:#e9f7f1; overflow-wrap:anywhere; }
    .created-link.is-visible { display:block; }
    .created-link a { color:#0d6849; font-weight:700; }
    button { min-height:44px; padding:0 18px; border:0; border-radius:12px; color:#fff; background:var(--brand); font:inherit; font-weight:750; cursor:pointer; }
    .status { color:var(--muted); font-size:14px; }
    .empty,.error { padding:24px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    .error { color:#8a1c1c; border-color:#e7b8b8; }
    .recipient { margin-top:24px; padding:24px; border:1px solid var(--line); border-radius:22px; background:var(--surface); box-shadow:0 12px 32px rgba(6,19,34,.07); }
    .recipient h2 { margin:0 0 18px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .stat { padding:18px; border-radius:15px; background:#eef5fc; }
    .stat span { display:block; color:var(--muted); font-size:13px; }
    .stat strong { display:block; margin-top:5px; font-size:23px; font-variant-numeric:tabular-nums; }
    .complete { color:var(--success); }
    .sessions { width:100%; margin-top:22px; border-collapse:collapse; font-size:14px; }
    th,td { padding:11px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    @media(max-width:760px){ body{padding:16px 12px 40px}.creator{grid-template-columns:1fr}.creator label,.created-link{grid-column:1}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.recipient{padding:18px}.table-wrap{overflow:auto}.sessions{min-width:720px} }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Oglądalność prezentacji ELABS</h1>
      <p>Prywatny podgląd otwarć, realnego czasu oglądania i ostatniego miejsca filmu.</p>
    </header>
    <div class="toolbar">
      <span class="status" id="status">Ładowanie danych...</span>
      <button id="refresh" type="button">Odśwież</button>
    </div>
    <form class="creator" id="creator">
      <label for="recipient-name">Nowy indywidualny link</label>
      <input id="recipient-name" name="recipient-name" minlength="2" maxlength="80" required placeholder="Np. Kierowniczka, Dyrektor, Zarząd 1">
      <button type="submit">Utwórz i skopiuj link</button>
      <div class="created-link" id="created-link" aria-live="polite"></div>
    </form>
    <div id="results"></div>
  </main>
  <script src="../analytics-config.js"></script>
  <script>
    const statusNode = document.querySelector('#status');
    const resultsNode = document.querySelector('#results');
    const refreshButton = document.querySelector('#refresh');
    const creatorForm = document.querySelector('#creator');
    const recipientName = document.querySelector('#recipient-name');
    const createdLink = document.querySelector('#created-link');
    const params = new URLSearchParams(location.hash.slice(1));
    const suppliedToken = params.get('admin');
    if (suppliedToken) {
      sessionStorage.setItem('elabsPresentationAdmin', suppliedToken);
      history.replaceState(null, '', location.pathname + location.search);
    }
    const adminToken = suppliedToken || sessionStorage.getItem('elabsPresentationAdmin');
    const config = window.ELABS_ANALYTICS;

    const formatTime = (seconds) => {
      const value = Math.max(0, Math.round(Number(seconds) || 0));
      const hours = Math.floor(value / 3600);
      const minutes = Math.floor((value % 3600) / 60);
      const rest = value % 60;
      return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${String(rest).padStart(2, '0')}` : `${minutes}:${String(rest).padStart(2, '0')}`;
    };
    const formatDate = (value) => value ? new Intl.DateTimeFormat('pl-PL', { dateStyle:'medium', timeStyle:'short' }).format(new Date(value)) : 'Jeszcze nie otwarto';
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
    const randomToken = () => {
      const bytes = crypto.getRandomValues(new Uint8Array(32));
      return btoa(String.fromCharCode(...bytes)).replaceAll('+', '-').replaceAll('/', '_').replaceAll('=', '');
    };
    const sha256 = async (value) => {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
      return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, '0')).join('');
    };
    const apiHeaders = () => ({ 'apikey':config.anonKey, 'Authorization':`Bearer ${config.anonKey}`, 'Content-Type':'application/json' });

    const render = (data) => {
      const recipients = data.recipients || [];
      if (!recipients.length) {
        resultsNode.innerHTML = '<div class="empty">Nie ma jeszcze skonfigurowanych odbiorców.</div>';
        return;
      }
      resultsNode.innerHTML = recipients.map((recipient) => {
        const duration = Number(recipient.duration_seconds) || 0;
        const furthest = Number(recipient.furthest_seconds) || 0;
        const percent = duration ? Math.min(100, Math.round((furthest / duration) * 100)) : 0;
        const sessions = (recipient.sessions || []).map((session) => `
          <tr>
            <td>${formatDate(session.started_at)}</td>
            <td>${formatTime(session.watched_seconds)}</td>
            <td>${formatTime(session.last_position_seconds)}</td>
            <td>${formatTime(session.furthest_seconds)}</td>
            <td>${session.sound_on ? 'Tak' : 'Nie'}</td>
            <td>${session.completed ? 'Tak' : 'Nie'}</td>
          </tr>`).join('');
        return `
          <section class="recipient">
            <h2>${escapeHtml(recipient.label)}</h2>
            <div class="stats">
              <div class="stat"><span>Otwarcia</span><strong>${recipient.visits}</strong></div>
              <div class="stat"><span>Łączny czas oglądania</span><strong>${formatTime(recipient.watched_seconds)}</strong></div>
              <div class="stat"><span>Najdalszy moment</span><strong>${formatTime(furthest)} (${percent}%)</strong></div>
              <div class="stat"><span>Całość</span><strong class="${recipient.completed ? 'complete' : ''}">${recipient.completed ? 'Tak' : 'Nie'}</strong></div>
            </div>
            <p>Ostatnia aktywność: <strong>${formatDate(recipient.last_seen_at)}</strong>. Dźwięk włączony: <strong>${recipient.sound_on ? 'tak' : 'nie'}</strong>.</p>
            <div class="table-wrap"><table class="sessions"><thead><tr><th>Otwarcie</th><th>Realnie oglądane</th><th>Ostatnie miejsce</th><th>Najdalej</th><th>Dźwięk</th><th>Koniec</th></tr></thead><tbody>${sessions || '<tr><td colspan="6">Brak sesji</td></tr>'}</tbody></table></div>
          </section>`;
      }).join('');
    };

    const loadReport = async () => {
      if (!adminToken || !config) {
        statusNode.textContent = 'Brak prywatnego tokenu dostępu.';
        resultsNode.innerHTML = '<div class="error">Otwórz prywatny link zapisany w SEJF. Bez niego raport pozostaje niedostępny.</div>';
        return;
      }
      refreshButton.disabled = true;
      statusNode.textContent = 'Pobieranie aktualnych danych...';
      try {
        const response = await fetch(`${config.url}/rest/v1/rpc/elabs_presentation_report`, {
          method:'POST',
          headers:apiHeaders(),
          body:JSON.stringify({ p_admin_token:adminToken })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        render(data);
        statusNode.textContent = `Stan na ${formatDate(data.generated_at)}`;
      } catch (_) {
        statusNode.textContent = 'Nie udało się pobrać raportu.';
        resultsNode.innerHTML = '<div class="error">Sprawdź prywatny link lub spróbuj ponownie za chwilę.</div>';
      } finally {
        refreshButton.disabled = false;
      }
    };
    creatorForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!adminToken || !config) return loadReport();
      const label = recipientName.value.trim();
      if (label.length < 2) return;
      const token = randomToken();
      const tokenHash = await sha256(token);
      const submitButton = creatorForm.querySelector('button');
      submitButton.disabled = true;
      try {
        const response = await fetch(`${config.url}/rest/v1/rpc/elabs_presentation_create_recipient`, {
          method:'POST',
          headers:apiHeaders(),
          body:JSON.stringify({ p_admin_token:adminToken, p_label:label, p_token_hash:tokenHash })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const viewerUrl = `${location.origin}/prezentacjaelabs/#v=${token}`;
        createdLink.innerHTML = `Link dla <strong>${escapeHtml(label)}</strong>: <a href="${viewerUrl}" target="_blank" rel="noopener">${viewerUrl}</a>`;
        createdLink.classList.add('is-visible');
        recipientName.value = '';
        try { await navigator.clipboard.writeText(viewerUrl); createdLink.insertAdjacentHTML('beforeend', '<br>Link został skopiowany do schowka.'); } catch (_) {}
        await loadReport();
      } catch (_) {
        createdLink.textContent = 'Nie udało się utworzyć linku. Spróbuj ponownie.';
        createdLink.classList.add('is-visible');
      } finally {
        submitButton.disabled = false;
      }
    });
    refreshButton.addEventListener('click', loadReport);
    loadReport();
    window.setInterval(loadReport, 30000);
  </script>
</body>
</html>
